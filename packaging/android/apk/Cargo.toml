[package]
name = "vectorcraft-android-apk"
description = "VectorCraft Android NativeActivity shared library (libvectorcraft.so)"
version = "0.18.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "vectorcraft"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vectorcraft = { path = "../../../apps/vectorcraft", default-features = false, features = ["wgpu"] }
log = "0.4"

[profile.release]
lto = false
codegen-units = 1
strip = "symbols"

[workspace]

[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
