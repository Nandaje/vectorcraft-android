[package]
name = "vectorcraft-android-apk"
description = "VectorCraft Android NativeActivity shared library (libvectorcraft.so)"
version = "0.16.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "vectorcraft"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
vectorcraft = { path = "../../../apps/vectorcraft", default-features = false, features = ["wgpu"] }
log = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]

[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "2eca9b3a53a98ac52efed2a27353c6a6927ead10" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "2eca9b3a53a98ac52efed2a27353c6a6927ead10" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "2eca9b3a53a98ac52efed2a27353c6a6927ead10" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "2eca9b3a53a98ac52efed2a27353c6a6927ead10" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "2eca9b3a53a98ac52efed2a27353c6a6927ead10" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "2eca9b3a53a98ac52efed2a27353c6a6927ead10" }
